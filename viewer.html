<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우호 지면 탐색기</title>
<script src="viewer_data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.tabs a{padding:5px 12px;color:var(--mut);text-decoration:none;font-size:13px}.tabs a.on{background:var(--acc);color:#fff}
:root{--bg:#f6f6f3;--card:#fff;--fg:#1c1c1a;--mut:#6d6c66;--line:#e3e2dc;--acc:#1c69d4;--acc2:#e8f0fb;--fav:#1f7a4a;--warn:#b5482f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1d1d1b;--fg:#ecebe5;--mut:#a3a29b;--line:#2f2f2c;--acc:#5b9bf0;--acc2:#1f2a3a;--fav:#5cbf88;--warn:#e07a62}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{padding:18px 24px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
.meta{color:var(--mut);font-size:13px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:110px}
.kpi b{display:block;font-size:18px}.kpi span{color:var(--mut);font-size:12px}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:0 24px 24px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:0 16px 16px}header{padding:16px}}
aside{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;align-self:start;position:sticky;top:12px}
.f{margin-bottom:14px}.f label.t{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.f .hint{color:var(--mut);font-size:12px;margin-top:3px}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1;min-width:0}
input[type=number],input[type=date],select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--fg);padding:6px 4px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.btn{width:100%;padding:9px;border:0;border-radius:7px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--acc);margin-top:6px}
main{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.tbl{overflow:auto;max-height:calc(100vh - 190px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600;cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}
td.title{white-space:normal;min-width:260px;max-width:380px}
td.ex{white-space:normal;min-width:320px;max-width:520px;color:var(--mut);font-size:12px}
td.title a{color:var(--fg);text-decoration:none}td.title a:hover{color:var(--acc);text-decoration:underline}
.sc{font-weight:700;color:var(--fav)}.lo{color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:4px;background:var(--acc2);color:var(--acc);margin-left:4px}
.empty{padding:40px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="h1">우호 지면 탐색기</h1>
    <div class="meta" id="meta"></div>
    <div class="tabs"><a class="on" href="viewer.html">표로 보기</a><a href="comments.html">말풍선으로 보기</a><a href="map.html">한눈에 보기</a></div>
  </div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="wrap">
<aside>
  <div class="f"><label class="t">분석 브랜드 · 모델</label>
    <select id="brand"></select>
    <div class="hint">모든 브랜드의 우호·비우호 댓글을 함께 쌓고 있어요. 기본은 자사.</div></div>
  <div class="f"><label class="t">영상 게시일</label>
    <div class="row"><input type="date" id="d1"><span>~</span><input type="date" id="d2"></div></div>
  <div class="f"><label class="t">우호 댓글 점수 (%)</label>
    <div class="row"><input type="number" id="s1" step="0.01" placeholder="최소" value="0"><span>~</span><input type="number" id="s2" step="0.01" placeholder="최대"></div>
    <div class="hint">영상 댓글 중 우호 댓글 비율(댓글 수가 적으면 평균 쪽으로 보정). 더 엄격하게 보려면 최소값에 브랜드 평균을 넣어 보세요. <span id="avgHint"></span></div></div>
  <div class="f"><label class="t">우호 채널 점수 (%)</label>
    <div class="row"><input type="number" id="c1" step="0.1" placeholder="최소" value="0"><span>~</span><input type="number" id="c2" step="0.1" placeholder="최대"></div>
    <div class="hint">채널 영상 중 우호 댓글이 달린 영상 비중. <b>최대</b>를 낮게 두고 우호 댓글 점수를 높이면 '비우호 채널 속 우호 영상'만 뽑혀요.</div></div>
  <div class="f"><label class="t">조회수</label>
    <div class="row"><input type="number" id="v1" placeholder="최소" value="0"><span>~</span><input type="number" id="v2" placeholder="최대"></div></div>
  <div class="f"><label class="t">채널 구독자 수</label>
    <div class="row"><input type="number" id="u1" placeholder="최소" value="0"><span>~</span><input type="number" id="u2" placeholder="최대"></div></div>
  <div class="f"><label class="t">영상 형식</label>
    <div class="seg" id="fmt"><button data-v="all" class="on">전체</button><button data-v="long">일반</button><button data-v="short">쇼츠</button></div>
    <div class="hint">쇼츠 = 길이 3분 이하</div></div>
  <div class="f">
    <label class="chk"><input type="checkbox" id="noKids" checked> 아동용 영상 제외</label>
    <label class="chk"><input type="checkbox" id="noOff" checked> <span id="offLbl">자사 공식·딜러 채널 제외</span></label>
    <label class="chk"><input type="checkbox" id="onlyFav" checked> 우호 댓글 1개 이상인 영상만</label>
  </div>
  <button class="btn" id="xlsx">엑셀 다운로드</button>
  <button class="btn ghost" id="reset">필터 초기화</button>
</aside>
<main>
  <div class="bar"><div id="count"></div><div class="meta">열 제목을 누르면 정렬돼요</div></div>
  <div class="tbl"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>조건에 맞는 영상이 없어요.</div></div>
</main>
</div>
<script>
const DATA = window.CARDB || [], META = window.CARDB_META || {};
const COLS = [
  ["ch","채널 제목","l"],["subs","구독자 수"],["chScore","우호 채널 점수"],["title","영상 제목","l title"],
  ["url","영상 링크","l"],["date","업로드 날짜"],["views","조회수"],["score","우호 댓글 점수"],
  ["n","분석 댓글 수"],["fav","우호 댓글 수"],["unfav","비우호 댓글 수"],["ex","우호 댓글 발췌","l ex"]
];
let sortKey = "score", sortDir = -1, fmt = "all", BR = META.brand || "BMW", ROWS = [], AVG = 0;
const $ = id => document.getElementById(id);
const nf = n => (n||0).toLocaleString("ko-KR");

// 브랜드 아래에 모델을 들여써서 보여줌 ("BMW" → "  └ 7시리즈")
function brandOptions(list, sel){
  return list.map(b => { const i = b.indexOf(" "), lbl = i < 0 ? b : "\u00a0\u00a0└ " + b.slice(i+1);
    return `<option value="${b}"${b===sel?" selected":""}>${lbl}</option>`; }).join(""); }
// 선택한 브랜드 기준으로 점수 계산 (수집기에는 브랜드별 원자료만 저장)
function compute(brand){
  const K = 200, K2 = 10;
  let ta = 0, tf = 0;
  DATA.forEach(d => { ta += d.n; tf += (d.b[brand]||[0,0,0])[1]; });
  const p0 = ta ? tf / ta : 0;
  const ch = {};
  DATA.forEach(d => { if (d.n >= 20) { const c = ch[d.chId] || (ch[d.chId] = [0,0]); c[0]++; if ((d.b[brand]||[0,0,0])[1] > 0) c[1]++; } });
  let tv = 0, tq = 0; Object.values(ch).forEach(c => { tv += c[0]; tq += c[1]; });
  const q0 = tv ? tq / tv : 0;
  AVG = p0 * 100;
  ROWS = DATA.map(d => { const x = d.b[brand] || [0,0,0], c = ch[d.chId];
    return {...d, fav: x[1], unfav: x[2], mention: x[0],
      score: +((x[1] + K * p0) / (d.n + K) * 100).toFixed(3),
      chScore: +(c ? (c[1] + K2 * q0) / (c[0] + K2) * 100 : q0 * 100).toFixed(1),
      official: (d.off || []).includes(brand.split(" ")[0]) ? 1 : 0, exText: (d.ex || {})[brand] || "" }; });
  $("avgHint").textContent = `(현재 ${brand} 평균 ${AVG.toFixed(3)}%)`;
  $("h1").textContent = brand + " 우호 지면 탐색기";
  $("offLbl").textContent = brand + " 공식·딜러 채널 제외";
  $("kpis").innerHTML = [["분석 영상",META.videos],["채널",META.channels],["분석 댓글",META.comments],[brand+" 우호 댓글",tf]]
    .map(([l,v])=>`<div class="kpi"><b>${nf(v)}</b><span>${l}</span></div>`).join("");
}

$("meta").textContent = META.updated ? `마지막 업데이트 ${META.updated}` : "아직 데이터가 없어요. 수집실행.bat을 먼저 실행하세요.";
$("brand").innerHTML = brandOptions(META.brands || [BR], BR);
$("brand").onchange = e => { BR = e.target.value; compute(BR); render(); };

$("thead").innerHTML = COLS.map(([k,l,c])=>`<th class="${c||""}" data-k="${k}">${l}</th>`).join("");
$("thead").onclick = e => { const k = e.target.dataset.k; if(!k) return; sortDir = (sortKey===k) ? -sortDir : -1; sortKey = k; render(); };
$("fmt").onclick = e => { if(!e.target.dataset.v) return; fmt = e.target.dataset.v; [...$("fmt").children].forEach(b=>b.classList.toggle("on", b===e.target)); render(); };
document.querySelectorAll("aside input").forEach(i => i.addEventListener("input", render));
$("reset").onclick = () => { document.querySelectorAll("aside input[type=number],aside input[type=date]").forEach(i=>i.value="");
  $("v1").value = $("u1").value = $("c1").value = $("s1").value = 0; setDates();
  $("noKids").checked = $("noOff").checked = $("onlyFav").checked = true; fmt="all";
  [...$("fmt").children].forEach((b,i)=>b.classList.toggle("on", i===0)); render(); };

const num = id => { const v = $(id).value; return v === "" ? null : +v; };
function filtered(){
  const d1=$("d1").value, d2=$("d2").value, s1=num("s1"), s2=num("s2"), c1=num("c1"), c2=num("c2"),
        v1=num("v1"), v2=num("v2"), u1=num("u1"), u2=num("u2");
  return ROWS.filter(r =>
    (!d1 || r.date >= d1) && (!d2 || r.date <= d2) &&
    (s1===null || r.score >= s1) && (s2===null || r.score <= s2) &&
    (c1===null || r.chScore >= c1) && (c2===null || r.chScore <= c2) &&
    (v1===null || r.views >= v1) && (v2===null || r.views <= v2) &&
    (u1===null || r.subs >= u1) && (u2===null || r.subs <= u2) &&
    (fmt==="all" || (fmt==="short" ? r.dur>0 && r.dur<=180 : r.dur>180)) &&
    (!$("noKids").checked || !r.kids) && (!$("noOff").checked || !r.official) &&
    (!$("onlyFav").checked || r.fav > 0));
}
function render(){
  const rows = filtered().sort((a,b)=>{ const x=a[sortKey], y=b[sortKey]; return (x>y?1:x<y?-1:0)*sortDir; });
  $("count").innerHTML = `<b>${nf(rows.length)}</b>개 영상 · 채널 ${nf(new Set(rows.map(r=>r.chId)).size)}개`;
  document.querySelectorAll("#thead th").forEach(th => th.textContent = COLS.find(c=>c[0]===th.dataset.k)[1] + (th.dataset.k===sortKey ? (sortDir<0?" ▼":" ▲") : ""));
  const show = rows.slice(0, 1500);
  $("tbody").innerHTML = show.map(r => `<tr>
    <td class="l">${esc(r.ch)}${r.dur>0&&r.dur<=180?'<span class="tag">쇼츠</span>':''}</td><td>${nf(r.subs)}</td><td>${r.chScore.toFixed(1)}</td>
    <td class="l title"><a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)}</a></td>
    <td class="l"><a href="${r.url}" target="_blank" rel="noopener">열기</a></td><td>${r.date}</td><td>${nf(r.views)}</td>
    <td class="${r.fav?'sc':'lo'}">${r.score.toFixed(3)}</td><td>${nf(r.n)}</td><td>${nf(r.fav)}</td><td>${nf(r.unfav)}</td>
    <td class="l ex">${esc(r.exText)}</td></tr>`).join("");
  $("empty").hidden = rows.length > 0;
  if (rows.length > show.length) $("count").innerHTML += ` <span class="meta">(화면엔 상위 1,500개만, 엑셀엔 전부)</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("xlsx").onclick = () => {
  const rows = filtered().sort((a,b)=>{ const x=a[sortKey], y=b[sortKey]; return (x>y?1:x<y?-1:0)*sortDir; });
  const aoa = [COLS.map(c=>c[1])].concat(rows.map(r => [r.ch, r.subs, r.chScore, r.title, r.url, r.date, r.views, r.score, r.n, r.fav, r.unfav, r.exText]));
  if (!window.XLSX) {  // 인터넷이 안 될 때는 CSV로
    const csv = "﻿" + aoa.map(a=>a.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = `우호지면_${new Date().toISOString().slice(0,10)}.csv`; a.click(); return;
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [22,10,12,50,44,12,12,12,10,10,10,90].map(w=>({wch:w}));
  ws["!autofilter"] = {ref: ws["!ref"]};
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "우호지면");
  XLSX.writeFile(wb, `${BR}_우호지면_${new Date().toISOString().slice(0,10)}.xlsx`);
};
// 기간 기본값: 데이터 전체 기간
function setDates(){ const ds = DATA.map(d=>d.date).filter(Boolean).sort();
  if (ds.length){ $("d1").value = ds[0]; $("d2").value = ds[ds.length-1]; } }
setDates();
compute(BR);
render();
</script>
<script>if(window.top!==window){document.querySelectorAll(".tabs").forEach(t=>t.style.display="none");}</script>
</body>
</html>
